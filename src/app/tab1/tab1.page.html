<ion-header>
  <ion-toolbar>
    <ion-title>Recepty</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let r of recipes">
      <ion-label>
        <h2>{{ r.name }}</h2>
        <p *ngIf="r.description">{{ r.description }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="null">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
