<ion-header>
  <ion-toolbar>
    <ion-title>Přidat produkt</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="stacked">Název</ion-label>
    <ion-input [(ngModel)]="name"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Čárový kód</ion-label>
    <ion-input [(ngModel)]="barcode"></ion-input>
    <ion-button slot="end" (click)="scan()" [disabled]="scanning">
      <ion-icon slot="start" name="barcode"></ion-icon>
      {{ scanning ? 'Skenuji…' : 'Skenovat' }}
    </ion-button>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Jednotka</ion-label>
    <ion-input [(ngModel)]="unit"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Množství (přidat do spíže)</ion-label>
    <ion-input type="number" [(ngModel)]="amount"></ion-input>
  </ion-item>

  <ion-button expand="full" (click)="findByBarcode()">Najít podle čárového kódu</ion-button>
  <ion-button expand="full" color="primary" (click)="saveProduct()">Uložit produkt a přidat do spíže</ion-button>
</ion-content>
