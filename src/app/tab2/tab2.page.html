<ion-header>
  <ion-toolbar>
    <ion-title>Spíž</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let item of pantryItems">
      <ion-label>
        <h2>
          {{ item.productName }}
          <ion-icon *ngIf="item.productLoadError" name="warning-outline" color="danger"></ion-icon>
        </h2>
        <p>{{ item.amount }} {{ item.unit }}</p>
      </ion-label>

      <ion-buttons slot="end">
        <ion-button (click)="decrease(item)"><ion-icon slot="icon-only" name="remove-circle-outline"></ion-icon></ion-button>
        <ion-button disabled>{{ item.amount }}</ion-button>
        <ion-button (click)="increase(item)"><ion-icon slot="icon-only" name="add-circle-outline"></ion-icon></ion-button>
        <ion-button color="danger" (click)="remove(item)"><ion-icon slot="icon-only" name="trash"></ion-icon></ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>
</ion-content>
